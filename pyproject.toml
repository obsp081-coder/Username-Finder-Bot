[project]
name = "username-finder-bot"
version = "0.1.0"
description = "Local Snapchat username research desktop application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "tzdata>=2025.1", "aiohttp>=3.9", "rich>=13.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4", "hypothesis>=6", "ruff>=0.9"]

[tool.setuptools.package-data]
username_finder = ["vendor/rovalid/SOURCE.json", "vendor/rovalid/LICENSE", "vendor/rovalid/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["username_finder/vendor/rovalid"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
